# =============================================================================
# ZAKPOS - Canonical Docker Compose (single-file stack)
# =============================================================================
# Boots from a CLEAN CLONE on any machine with Docker:
#   1. scripts/gen-or-copy-env.sh   (creates server/.env from .env.example)
#   2. docker compose up -d --build
#
# Volumes are project-scoped (zakpos_postgres_dev_data, zakpos_redis_dev_data,
# zakpos_ocr_model_cache). On the author's machine those volumes already exist
# and are reused by name; on a fresh machine compose creates them empty and
# docker/postgres/init.sql provisions the databases on first boot.
#
# Services:
#   postgres  47821:5432   PostgreSQL 17 (RLS tenancy, init.sql on first boot)
#   redis     46392:6379   sessions
#   server    39847:3000   NestJS API, runs `prisma migrate deploy` on boot
#   client    41923:3000   Next.js standalone (NEXT_PUBLIC_* baked at build)
#   ocr       58000:8000   FastAPI + tesseract + CPU torch
# =============================================================================
name: zakpos

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - mirrors the live zakpos-postgres-1 service definition exactly
  # (same image, ports, binds, command) so compose reuses the named volume.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: zakpos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_MULTIPLE_DATABASES: zakpos_dev,zakpos_test
    ports:
      - "47821:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/prisma/bootstrap/create_app_role.sql:/docker-entrypoint-initdb.d/02-app-role.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/dev-logging.conf:/etc/postgresql/conf.d/dev-logging.conf:ro
    command: [
      "postgres",
      "-c", "config_file=/etc/postgresql/postgresql.conf",
      "-c", "hba_file=/etc/postgresql/pg_hba.conf",
      "-c", "log_statement=all",
      "-c", "log_min_duration_statement=0",
      "-c", "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zakpos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - same image / password / config bind as the live zakpos-redis-1.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.4-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: redis123
    ports:
      - "46392:6379"
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: [
      "redis-server",
      "/etc/redis/redis.conf",
      "--requirepass", "redis123",
      "--loglevel", "verbose",
      "--save", "60", "1000"
    ]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # NestJS API. Secrets (JWT, Auth0, OCR key) come from server/.env via
  # env_file and are NOT inlined here. Only the local dev DB/Redis/OCR
  # in-container hostnames are overridden via `environment`.
  # Boot: `prisma migrate deploy` then node dist/main.js (see command).
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    container_name: zakpos-api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # development (not production) so the mock customer-OTP provider stays
      # usable on this dev stack — it fail-closes in production by design.
      NODE_ENV: development
      API_PORT: "3000"
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/zakpos_dev?schema=public"
      DATABASE_APP_URL: "postgresql://zakpos_app:zakpos_app_dev_2026@postgres:5432/zakpos_dev"
      REDIS_URL: "redis://:redis123@redis:6379"
      OCR_SERVICE_URL: "http://ocr:8000"
      CORS_ORIGIN: "http://localhost:41923,http://localhost:3000,http://localhost:96140"
    command: ["dumb-init", "sh", "-c", "npx prisma migrate deploy && exec node dist/main.js"]
    ports:
      - "39847:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Next.js client (standalone runtime). NEXT_PUBLIC_* vars must be baked at
  # BUILD time; the app only reads NEXT_PUBLIC_API_URL (grep of client/src).
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:39847/api/v1"
        NEXT_PUBLIC_WS_URL: "ws://localhost:39847"
        NEXT_PUBLIC_APP_ENV: "development"
    container_name: zakpos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Next standalone server.js reads HOSTNAME for its bind address; force
      # all-interfaces binding so the port publish and healthcheck work.
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "41923:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FastAPI OCR service (tesseract + CPU torch in the image).
  # OCR_API_KEY intentionally empty, mirroring server/.env (permissive dev
  # mode - both sides must agree or in-network calls get 401).
  # ---------------------------------------------------------------------------
  ocr:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    container_name: zakpos-ocr
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/zakpos_dev"
      REDIS_URL: "redis://:redis123@redis:6379"
      OCR_API_KEY: ""
      OCR_ENABLE_GPU: "false"
      CORS_ORIGINS: "http://localhost:41923,http://localhost:3000,http://localhost:96140"
      LOG_LEVEL: info
    ports:
      - "58000:8000"
    volumes:
      # Persist the HuggingFace trocr model download across container recreations.
      - ocr_model_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Overrides the Dockerfile HEALTHCHECK: trocr-small download + load can
      # take several minutes on first boot.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

# =============================================================================
# VOLUMES
# Project-scoped (prefix `zakpos_`): reused in place if they already exist,
# created empty on a fresh machine. Never mark them external again - that
# broke first-run on any machine other than the author's.
# =============================================================================
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  ocr_model_cache:
    driver: local
